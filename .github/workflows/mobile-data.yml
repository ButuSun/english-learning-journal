name: Update mobile content
on:
  push:
    branches: [main]
    paths: [index.html, 'mobile/app.js', 'mobile/index.html', 'mobile/style.css', 'scripts/build-mobile.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mobile-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-mobile.mjs
      - name: Commit generated mobile content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/data.json mobile/version.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update mobile journal content'
            git push
          fi
