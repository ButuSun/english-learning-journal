    ],
    "revised": "I've been through a rough day. Today, I was assigned to attend a government training session. It's not even part of my job responsibilities, but my leader told me to go, and I had no choice but to say yes. The room was terrible, so I spent my own money to stay at a hotel I had stayed at before. It made me feel comfortable. The session was boring, and the person in charge even counted everyone who attended. Fortunately, my friend helped me sign the attendance sheet, but I still felt uncertain because I was afraid of being punished by my own leader and letting them down.\n\nThe only thing I want to do is study for the postgraduate entrance examination. I don't care much about anything else right now. Because of today's interruptions, my study progress has stalled. Fortunately, nothing bad happened. I had a big cup of Starbucks coffee at lunchtime, studied for a while, and talked to you about my plans, which made me happy. In the afternoon, I watched half a movie and did a few small things. I don't want to waste my time, and I think some things are more important than money. Even though I've had a rough day, I finally have some peaceful time to rest. Hopefully, there won't be any more trouble, and I can focus on studying!\n\nYou really understood how I feel! I just want to spend my time on things I care about. If the session were interesting, I wouldn't skip it. My roommate makes noise when he sleeps and gets up very early in the morning. I don't want to share a room with him anymore. I have some money, so I have a choice about how I want to live. After all, I made up my mind to pay for another night at the hotel.\n\nIf I were on a personal trip rather than a work trip, I would choose a nice hotel without a second thought. The only reason I hesitated to stay somewhere else was that I wasn't sure it was worth spending my own money on a work trip. Next time, I won't lower my living standards or sacrifice my comfort just for work.",

 "hesitate to do sth. 表示犹豫是否做某事。": "Use hesitate to do something when you are unsure whether to do it.",
 "be worth + doing 或 be worth + 名词；这里按上下文用 wasn't sure it was worth spending my own money。": "Use be worth + gerund or noun. Here, wasn't sure it was worth spending my own money fits the context.",
 "lose 是失去，loose 是松的；lower one's standards 表示降低标准；sacrifice 拼写注意。": "Lose means to stop having something. Loose means not tight. Use lower one's standards and check the spelling of sacrifice.",
 "have no choice but to + 动词原形；have a choice 中需要冠词 a。": "Use have no choice but to + base verb. Include a in have a choice.",
 "自己是受处罚的人，用 be punished；of 后接动名词 being。": "Use the passive be punished for the person receiving the punishment. Use the gerund being after of.",
 "make + 宾语 + 动词原形；不要叠加 is makes。": "Use make + object + base verb. Use makes on its own instead of is makes.",
 "want to do；make up one's mind 表示下定决心，过去式 made。": "Use want to do. Make up one's mind means decide firmly. The past tense is made.",
 "stuck 本身已是过去分词，不是 stucked；study 过去式 studied。": "Stuck is already the past participle of stick. The past tense of study is studied.",
 "同一分句不要出现两个没有连接词的谓语；比较用 more ... than。": "Use a connector between finite verb phrases in the same clause. Use more ... than for comparisons.",
 "the fact 作主语中心词，谓语用 is。be related to 后接名词短语。": "The head of the subject is fact, so use is. Follow be related to with a noun phrase.",
 "in the past 表过去，谓语用 were。be busy doing sth.，make a living。": "In the past sets a past time frame, so use were. Use be busy doing something and make a living.",
 "regular 修饰名词 exercise。does 后用 benefit，but also 后的分句用正常语序。": "Regular modifies the noun exercise. Use the base form benefit after does. Use normal word order in the clause after but also.",
 "肯定句用 too，either 常用于否定句。": "Use too in affirmative statements and either in negative statements.",
 "by 后接动名词。Only by 置首时，can 提到主语前。healthy 是形容词，attitude 是态度。": "Use a gerund after by. When Only by opens the sentence, put can before the subject. Healthy is an adjective. Attitude refers to a way of thinking.",
 "用 such as 引出例子。这里泛指多个公园，用复数。": "Use such as to introduce examples. Use the plural when referring to parks in general.",
 "apologize to + 人，apologize for + 事情或动名词。": "Use apologize to + person and apologize for + noun or gerund.",
 "can、could、must 后直接接动词原形。": "After can, could, or must, use the base form of the verb.",
 "convenient 是“方便的”。请求对方改期，可以说 If it is convenient for you, could we reschedule…?": "Convenient means suitable or easy to arrange. To request a new time, you can write If it is convenient for you, could we reschedule ...?",
 "news 不可数。一条好消息用 a piece of good news。": "News is uncountable. Use a piece of good news for one item.",
 "用 when 引导时间从句时，可以用一般现在时表示未来。": "Use the simple present in a time clause with when even if the clause refers to the future.",
 "reply 在这里是名词。用 your 修饰，整句是 I look forward to your reply.": "Reply is a noun here. Use your in I look forward to your reply.",
 "to 接道歉的对象，for 接道歉的原因。正式开头也可以直接说 I am writing to apologize for…": "Use to for the person receiving the apology and for for the reason. In a formal opening, you can write I am writing to apologize for ...",
 "活动和面试都可以用 attend。说收到面试通知，可以写 I have just been asked to attend an interview.": "Use attend for both events and interviews. To explain that you received an invitation, write I have just been asked to attend an interview.",
 "because 接完整句子。because of 接名词短语，例如 because of an important interview。": "Follow because with a complete clause. Follow because of with a noun phrase, as in because of an important interview.",
 "convince 是“说服”。询问对方是否方便时，用 If it is convenient for you。": "Convince means persuade. Use If it is convenient for you to ask whether the arrangement suits the other person.",
 "说可能已经造成的不便，用 may have + 过去分词。": "Use may have + past participle for inconvenience that may already have occurred.",
 "要用 I look forward to 或 I am looking forward to。to 是介词，后接名词或动名词。": "Use I look forward to or I am looking forward to. Here to is a preposition and takes a noun or gerund.",

 "推荐上海旅游 · 建议信": "Recommending Shanghai · Letter of advice",
 "考研英语二 · Part A · 建议信 · 完整练习": "Entrance Exam English II · Part A · Letter of advice · Full practice",
 "本次为英语二 Part A 建议信，推荐外国朋友 David 来上海旅游。原稿保留了上海的城市体验、英语交流、迪士尼三个理由，并在结尾补充天气与提前订酒店的建议。批改以明确语法、拼写和必要固定搭配纠错为主，没有重写论证顺序。": "This Part A letter recommends Shanghai to David. It gives three reasons to visit: the city experience, communicating in English, and Disneyland. It ends with advice on the weather and booking a hotel early. The corrections focus on grammar, spelling, and essential collocations while preserving the order of ideas.",
 "本次可复用的三个句型与逻辑点": "Three reusable patterns and organizing ideas",
 "用定语从句明确推荐对象，适合建议信开头。": "Use a relative clause to name what you recommend at the start of a letter of advice.",
 "先总述推荐理由，再用 For one thing / For another 分点展开。": "State the overall point first, then develop the reasons with For one thing and For another.",
 "Considering + 名词短语引出需要考虑的情况，再提出具体建议。": "Use Considering + noun phrase to introduce a factor before giving specific advice.",
 "大学生在线学习比例上升 · 图表作文": "More College Students Are Studying Online · Chart essay",
 "考研英语二 · Part B · 图表作文 · 完整练习": "Entrance Exam English II · Part B · Chart essay · Full practice",
 "文章按图表描述、在线学习优势分析和总结建议展开。保留了用户关于自主选择学习内容、灵活参加课程和重复播放课程、培养独立学习能力的三个论点。重点复习定语从句、The fact that... 主语结构、There are... contributing to...、Not only 倒装、help + 人 + 动词原形，以及 It is important that + 主语 + 动词原形。": "The essay describes the chart, analyzes the advantages of online study, and ends with recommendations. It keeps the original points about choosing content, attending and replaying lessons flexibly, and developing independent study skills. Review relative clauses, The fact that ... as a subject, There are ... contributing to ..., Not only inversion, help + person + base verb, and It is important that + subject + base verb.",
 "用 The fact that 引导的主语结构，把观察到的现象和结论连接起来。": "Use a The fact that subject to connect an observation with a conclusion.",
 "用于并列两个优势；Not only 置于句首时倒装，does 后接动词原形。": "Use this pattern to pair two advantages. Invert the clause when Not only comes first and use the base verb after does.",
 "用于提出建议或强调必要性；that 从句中可使用动词原形 build。": "Use this pattern for advice or to emphasize necessity. The that-clause can take the base form build.",
 "考研压力与应对建议 · 建议信 · 语法理解专项练习": "Coping with Exam Stress · Letter of advice and grammar drills",
 "考研英语二 · Part A · 建议信 · 完整练习；同日补充：语法理解专项练习": "Entrance Exam English II · Part A · Letter of advice and supplementary grammar drills",
 "围绕考试压力提出两条建议：先从小任务开始，再通过喜欢的运动缓解压力。保留原文的建议顺序和鼓励语气。重点复习 such a + 名词、be familiar with、such as、have + 过去分词，以及 hope 后的主谓一致。 同日另完成3句语法理解练习，巩固现在完成进行时、Only by 倒装和 As 时间状语从句中的主谓一致。": "The letter suggests starting with a small task and relieving stress with an activity you enjoy. It preserves the original order of advice and its encouraging tone. Review such a + noun, be familiar with, such as, have + past participle, and agreement in the clause after hope. Three additional sentences practice the present perfect continuous, Only by inversion, and agreement in time clauses introduced by As.",
 "本次可复用的三个表达": "Three reusable expressions",
 "表达“随着考试临近”，用于引出压力或备考状态。": "Use this expression to introduce exam stress or describe the run-up to an exam.",
 "familiar 是形容词，固定搭配 be familiar with。": "Familiar is an adjective. The usual pattern is be familiar with.",
 "动名词短语作主语；适合表达循序渐进的建议。": "A gerund phrase acts as the subject. This pattern suits advice about gradual progress.",
 "语法理解专项：时态、倒装与主谓一致": "Grammar drill: tense, inversion, and subject–verb agreement",

 "语法理解专项练习（11月21日）": "Grammar Drill (November 21)",
 "1. 我很高兴你一直在为自己的梦想而努力。": "1. I'm glad you've been working toward your dream all this time.",
 "2. 只有通过循序渐进的努力，我们才能克服困难。": "2. Only by making steady progress can we overcome difficulties.",
 "3. 随着考试临近，学生们变得越来越焦虑。": "3. As the exam approaches, students are growing more anxious.",
 "语法理解专项练习修改稿（11月21日）": "Grammar Drill Revisions (November 21)",
 "大学生规律运动比例上升 · 图表作文": "More College Students Are Exercising Regularly · Chart essay",
 "文章按图表趋势、原因分析、建议结尾展开。保留了用户关于大学学习压力、运动释放压力、生活掌控感和健康饮食的论证。重点复习图表过去时、contribute to、compared with、help + 人 + do、control over，以及 Not only 倒装。": "The essay describes a trend, analyzes its causes, and ends with recommendations. It preserves the original discussion of academic pressure, exercise as stress relief, a sense of control, and a healthy diet. Review the past tense in chart descriptions, contribute to, compared with, help + person + base verb, control over, and Not only inversion.",
 "描述图表变化；注意过去式 rose，以及 from...to... 的搭配。": "Use the past tense rose to describe the change. Use from ... to ... for the starting and ending values.",
 "用现在分词短语修饰 factors，并记住 contribute to。": "A present-participial phrase modifies factors. Remember contribute to.",
 "Not only 放句首时倒装；should 后接动词原形，but also 后恢复正常语序。": "Starting with Not only triggers inversion. Use a base verb after should and normal word order after but also.",
 "校园摄影展邀请信 · Invitation to a Photography Exhibition · which从句与动词形式专项练习": "Invitation to a Campus Photography Exhibition · Which clauses and verb forms",
 "考研英语二 · Part A · 邀请信 · 完整练习；同日补充：语法专项翻译练习": "Entrance Exam English II · Part A · Invitation letter and supplementary translation drills",
 "保留原文的邀请逻辑：关心近况 → 邀请 → 赞美作品 → 介绍摄影展 → 时间地点。重点练习词性、定语从句、固定搭配；Part A 还需控制在约100词。 当天另完成6句语法专项翻译，重点巩固 which 从句、主谓一致、动词形式、Only by 倒装和 Not only 倒装。": "The invitation keeps the original sequence: ask how the recipient is doing, extend the invitation, praise their work, and give the details of the exhibition. Review parts of speech, relative clauses, and collocations. Aim for roughly 100 words in Part A. Six additional translation exercises cover which clauses, agreement, verb forms, and inversion with Only by and Not only.",
 "可复用的三个表达": "Three reusable expressions",
 "how + 形容词 + 主语 + 谓语，用来表达对他人能力的赞美。": "Use how + adjective + subject + verb to praise someone's skill.",
 "用于交代邀请或建议的原因。": "Use this pattern to explain the reason for an invitation or recommendation.",
 "用于邀请信结尾表达真诚期望。": "Use this expression at the end of an invitation to express a sincere hope.",
 "语法专项：which 从句与动词形式": "Grammar drill: which clauses and verb forms",

 "语法专项翻译练习（11月19日）": "Grammar Translation Drill (November 19)",
 "1. 规律运动可以减轻压力，这有助于我们更好地学习。": "1. Regular exercise can reduce stress, which helps us study better.",
 "2. 学校建立了一个新图书馆，这为学生提供了更好的学习环境。": "2. The school built a new library, giving students a better place to study.",
 "3. 越来越多的人选择网上购物，这使他们的生活更加方便。": "3. More people are choosing to shop online, making their lives more convenient.",
 "4. 只有通过每天练习，我们才能提高英语写作能力。": "4. Only through daily practice can we improve our English writing.",
 "5. 那些照片展现了他多么有才华。": "5. Those photographs showed how talented he was.",
 "6. 坚持阅读不仅能扩大我们的知识面，还能提高写作能力。": "6. Reading regularly broadens our knowledge and improves our writing skills.",
 "语法专项练习修改稿（11月19日）": "Grammar Drill Revisions (November 19)",
 "A Rough Day · 时间、工作与选择": "A Rough Day · Time, work, and choices",
 "英语自由表达 · 三轮对话 · 原文与语法复盘": "Free English practice · Three exchanges · Original writing and grammar review",
 "2026-11-18 自由英语口语/写作练习。重点是用真实经历组织叙事与表达个人选择，不计为限时考研真题作文；原文完整保留，修改稿供对照。": "Free speaking and writing practice on November 18, 2026. The focus was on telling a story from personal experience and expressing choices. This was an untimed practice entry. The original and revision are available for comparison.",
 "今天主动表达的三个观点": "Three ideas expressed in this practice",
 "工作安排不等于个人意愿": "A work assignment is not always a personal choice",
 "过去发生的情况用 had；but to 后面接动词原形。": "Use had for a past situation. Follow but to with the base form of the verb.",
 "我有选择生活方式的权利": "I can choose how I live",
 "原句思想保留；have a choice 表达“有选择权”。": "The original idea is preserved. Have a choice expresses the ability to decide.",
 "不为工作牺牲舒适度": "Keeping my standards and comfort at work",
 "这是未来的决定，用 won't；lower standards 与 sacrifice comfort 搭配。": "Use won't for a future decision. The expressions are lower standards and sacrifice comfort.",
 "可复用句型 · 三组": "Three reusable patterns",
 "假设：If I were..., I would...": "Hypothetical: If I were ..., I would ...",
 "现在虚拟条件句。": "A conditional about a present hypothetical situation.",
 "毫不犹豫：without a second thought": "Acting without hesitation: without a second thought",
 "不需要再添加另一个 think。": "The expression already conveys the idea. No extra verb is needed.",
 "下决心：make up one's mind": "Making a decision: make up one's mind",
 "越来越多人规律锻炼": "More People Are Exercising Regularly",
 "考研英语二 · 大作文 · 完整原稿": "Entrance Exam English II · Long essay · Full draft",
 "考研撞期，给教授写信改约": "Rescheduling with a Professor Because of an Exam Conflict",
 "考研英语 · 道歉信 · 完整原稿": "Entrance Exam English · Apology letter · Full draft",
 "临时面试，给对方写信改约": "Rescheduling Because of an Unexpected Interview",
 "考研英语 · 道歉信 · 逐句练习": "Entrance Exam English · Apology letter · Sentence-level practice",
 "大作文模板积累：七大方案与五大措施": "Long Essay Templates: Seven Argument Patterns and Five Types of Measures",
 "今日学习：七大方案中的三种论证方法，以及五大措施中的个人、教育两个实施主体；同时整理措施段的开头、关联词和结尾。": "Three argument patterns and two groups responsible for action were studied today. The notes also collect openings, linking phrases, and endings for a recommendations paragraph.",
 "一、七大方案：今日学习 3 / 7": "1. Argument Patterns · 3 of 7",
 "方案三：主语从句": "Pattern 3: Subject Clause",
 "It is widely acknowledged that + 完整句子。": "It is widely acknowledged that + complete clause.",
 "用固定句首引出观点；that 后接完整内容。": "Use the fixed opening to introduce a point. Follow that with a complete clause.",
 "方案四：Not only 倒装": "Pattern 4: Not Only Inversion",
 "Not only does + 主语 + 动词原形..., but it also + 动词...": "Not only does + subject + base verb ..., but it also + verb ...",
 "Not only 置于句首，前半句部分倒装；does 后用动词原形，but also 后恢复正常语序。": "Putting Not only first triggers inversion. Use a base verb after does and normal word order after but also.",
 "方案六：对比论证": "Pattern 6: Comparison",
 "Compared with B, A can + 小方面, so as to + 大方面.\nIn contrast to B, the advantage of A lies in + 某方面.": "Compared with B, A can + specific benefit, so as to + broader benefit.\nIn contrast to B, the advantage of A lies in + an aspect.",
 "通过比较 A 与 B，突出主要对象 A 的优势。": "Compare A with B to highlight A's advantages.",
 "二、五大措施：今日学习 2 个主体": "2. Types of Measures · Two Groups Studied",
 "个人行为（Personal）": "Personal Action",
 "We should spare no pains to + 动词原形.\n可替换：We should... / It is our duty to... / We are obliged to... / We ought to...\n行动表达可替换：spare no pains to... / make concerted efforts to... / take concrete steps to...": "We should spare no pains to + base verb.\nAlternative openings: We should ... / It is our duty to ... / We are obliged to ... / We ought to ...\nAlternative actions: spare no pains to ... / make concerted efforts to ... / take concrete steps to ...",
 "逻辑：个人主体 + 主动采取行动 + 实现具体目标。": "Identify who takes action, what they do, and what they aim to achieve.",
 "教育引导（Schools / Parents）": "Guidance from Schools and Parents",
 "Parents and teachers should set a good example for children in + 主题, through their own behavior.\nParents can serve as role models for their children by + doing...\nParents and schools should create more opportunities for children to participate in...": "Parents and teachers should set a good example for children in + topic, through their own behavior.\nParents can serve as role models for their children by + doing ...\nParents and schools should create more opportunities for children to participate in ...",
 "逻辑：学校、家长或老师作为主体，通过引导、示范或创造机会帮助学生成长。": "Schools, parents, or teachers can help students grow by offering guidance, setting an example, or creating opportunities.",
 "三、五大措施的主体总览": "3. Five Groups and Types of Measures",
 "政府作为": "Government Action",
 "制定法律、制定政策、拨付资金。": "Pass laws, set policies, and allocate funding.",
 "公民意识": "Public Awareness",
 "提高公众意识、培养社会责任感。": "Raise awareness and encourage social responsibility.",
 "个人行为": "Personal Action",
 "个人主动采取行动。": "Individuals take the initiative.",
 "媒体呼吁": "Media Advocacy",
 "媒体宣传、倡导、呼吁。": "Publicize issues, advocate for change, and make appeals.",
 "家庭教育": "Family Education",
 "家长和老师以身作则、教育引导。": "Parents and teachers lead by example and offer guidance.",

function positionWritingTrack(animate=true, offset=0) {
 const viewport=entry.querySelector('.writing-viewport');
 const track=entry.querySelector('.writing-track');
 if(!viewport || !track) return;
 track.style.transition=animate && !matchMedia('(prefers-reduced-motion: reduce)').matches
  ? 'transform 320ms cubic-bezier(.22,.75,.24,1)' : 'none';
 track.style.transform='translate3d('+(-active*viewport.clientWidth+offset)+'px,0,0)';
 const current=track.children[active];
 if(current) viewport.style.height=current.offsetHeight+'px';
}
function updateWritingTabState(focusTab=false) {
 const buttons=entry.querySelectorAll('.tab');
 buttons.forEach((button,i)=>{
  button.setAttribute('aria-selected',String(i===active));
  button.tabIndex=i===active?0:-1;
 });
 entry.querySelectorAll('.writing-slide').forEach((panel,i)=>{
  panel.inert=i!==active;
  panel.setAttribute('aria-hidden',String(i!==active));
 });
 const chosen=buttons[active];
 chosen?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
 if(focusTab) chosen?.focus({preventScroll:true});
}
function switchWritingTab(next, focusTab=false) {
 if(next<0 || next>=tabs.length || next===active) return;
 active=next;
 positionWritingTrack(true);
 updateWritingTabState(focusTab);
 if(reader.open) readerBody.scrollTo({top:0,behavior:'smooth'});
}
function enableWritingSwipe(viewport) {
 let startX=0,startY=0,lastX=0,startTime=0,tracking=false,axis='';
 viewport.addEventListener('touchstart',event=>{
  if(event.touches.length!==1 || event.target.closest('input,textarea,select,[contenteditable="true"]')) {tracking=false;return;}
  startX=lastX=event.touches[0].clientX;
  startY=event.touches[0].clientY;
  startTime=performance.now();
  tracking=true;axis='';
  positionWritingTrack(false);
 },{passive:true});
 viewport.addEventListener('touchmove',event=>{
  if(!tracking || event.touches.length!==1) return;
  const dx=event.touches[0].clientX-startX,dy=event.touches[0].clientY-startY;
  if(!axis && Math.max(Math.abs(dx),Math.abs(dy))>7) axis=Math.abs(dx)>Math.abs(dy)*1.15?'horizontal':'vertical';
  if(axis!=='horizontal') return;
  event.preventDefault();
  lastX=event.touches[0].clientX;
  const atEdge=(active===0&&dx>0)||(active===tabs.length-1&&dx<0);
  positionWritingTrack(false,atEdge?dx*.22:dx);
 },{passive:false});
 const finish=(event,cancel=false)=>{
  if(!tracking) return;
  tracking=false;
  if(axis!=='horizontal'||cancel) {positionWritingTrack(true);return;}
  const dx=(event.changedTouches?.[0]?.clientX??lastX)-startX;
  const elapsed=Math.max(1,performance.now()-startTime);
  const speed=Math.abs(dx)/elapsed;
  const threshold=Math.min(90,viewport.clientWidth*.23);
  const delta=Math.abs(dx)>threshold||(Math.abs(dx)>35&&speed>.45) ? (dx<0?1:-1):0;
  const next=Math.max(0,Math.min(tabs.length-1,active+delta));
  if(next!==active) {
   active=next;
   updateWritingTabState(false);
   if(reader.open) readerBody.scrollTo({top:0,behavior:'smooth'});
  }
  positionWritingTrack(true);
 };
 viewport.addEventListener('touchend',event=>finish(event),{passive:true});
 viewport.addEventListener('touchcancel',event=>finish(event,true),{passive:true});
 window.addEventListener('resize',()=>{if(viewport.isConnected)positionWritingTrack(false)},{passive:true});
}

const PREP_START = '2026-10-12';

const TOTAL_PREP_WEEKS = 10;
function updatePrepProgress() {
 const parseDate = value => {
  const [y,m,d]=value.split('-').map(Number);
  return Date.UTC(y,m-1,d);
 };
 const today = new Date();
 const todayUTC = Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());
 const startUTC = parseDate(PREP_START);
 const examUTC = parseDate(EXAM_DATE);
 const dayMs = 86400000;
 const elapsedDays = Math.floor((todayUTC-startUTC)/dayMs);
 const week = Math.max(0,Math.floor(elapsedDays/7)+1);
 const completedWeeks = Math.min(TOTAL_PREP_WEEKS,Math.max(0,week));
 const percent = completedWeeks/TOTAL_PREP_WEEKS*100;
 const remainingDays = Math.max(0,Math.ceil((examUTC-todayUTC)/dayMs));

const {writingSentences,wordsWithOffsets,locateWords,changedWordRanges}=JournalGrammar;
function compareKey(text) {
 return text.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');
}
// Each triple gives the original position and the number of original and revised
// sentences that belong together. Zero represents an addition or omission.
const archivedSentenceGroups = {
 '2026-11-23':[[12,1,2]],
 '2026-11-21':[[7,2,1],[14,2,1],[16,2,1],[18,2,1]],
 '2026-11-19':[[8,1,2],[13,2,1],[15,2,1],[17,2,1],[19,2,1],[21,2,1],[23,2,1]],
 '2026-11-18':[[0,1,0],[6,2,1],[8,2,1],[10,1,2],[12,1,2],[21,1,2],[23,2,1],[27,1,0]],
 '2026-11-15':[[0,0,1],[2,1,0],[5,2,1],[7,0,2]],
 '2026-11-14':[[1,2,1],[4,2,1],[6,1,0]]
};
function sentencePairs(originals,revised,groups) {
 const pairs=[];
 let left=0,right=0;
 const append=(before,after)=>{
  pairs.push([before,after]);
  left+=before.length;
  right+=after.length;
 };
 const single=()=>append(originals.slice(left,left+1),revised.slice(right,right+1));
 for(const [position,beforeCount,afterCount] of groups){
  while(left<position && left<originals.length)single();
  append(originals.slice(left,left+beforeCount),revised.slice(right,right+afterCount));
 }
 while(left<originals.length || right<revised.length){
  // When a new entry adds or removes a sentence, use the next unchanged sentence
  // as an anchor before pairing the rest.
  const before=originals[left],after=revised[right];
  if(before && after && compareKey(before)!==compareKey(after)){
   if(revised[right+1] && compareKey(before)===compareKey(revised[right+1])){
    append([], [after]);continue;
   }
   if(originals[left+1] && compareKey(originals[left+1])===compareKey(after)){
    append([before], []);continue;
   }
  }
  single();
 }
 return pairs;
}

const archivedGrammarLocations = {
 '2026-11-23':{3:[3,13]},
 '2026-11-21':{4:[4,5]},
 '2026-11-18':{1:[23,24]},
 '2026-11-16':{3:[5]}
};
function grammarLocations(record, originals, overrides) {
 const result=originals.map(()=>[]);
 const normalized=originals.map(compareKey);
 const unfound=[];
 (record.grammar||[]).forEach((item,index)=>{
  const fragments=String(item[1]||'').split(/\s+\/\s+|\.{3}|…/).map(compareKey).filter(key=>key.length>=4);
  const positions=overrides[index+1] || normalized.flatMap((sentence,i)=>
   fragments.some(fragment=>sentence.includes(fragment))?[i]:[]);
  if(!positions.length)unfound.push(index);
  positions.forEach(i=>result[i]?.push(index));
 });
 return {result,unfound};
}
// A few archived explanations quote a paraphrase or span two original sentences.
const archivedErrorPhrases = {
 '2026-11-23':{7:['that going'],12:['Booking','hope']},
 '2026-11-21':{4:['one','Nearly examination'],8:['fight','prepared this examination']},
 '2026-11-18':{1:['in a trip','in the work trip','choose to a nice hotel']},
 '2026-11-16':{1:['relate the lifestyle changed'],3:['does exercise good for','it but also']}
};
function markOriginalErrors(paragraph, sentence, issueIndexes, grammar, overrides) {
 const words=wordsWithOffsets(sentence);
 const ranges=issueIndexes.flatMap(index=>{
  const override=overrides[index+1];
  if(override)return override.flatMap(phrase=>locateWords(words,phrase).map(match=>[match[0].start,match.at(-1).end]));
  const [,before,after]=grammar[index];
  const split=/\s+\/\s+|\.{3}|…/;
  const originalParts=before.split(split), revisedParts=after.split(split);
  if(originalParts.length!==revisedParts.length)return [];
  return originalParts.flatMap((part,i)=>locateWords(words,part)
   .flatMap(match=>changedWordRanges(match,wordsWithOffsets(revisedParts[i]))));
 });
 appendMarkedText(paragraph,sentence,ranges,'del');
}
function appendMarkedText(paragraph,text,ranges,tag) {
 if(!ranges.length){paragraph.append(displayText(text));return;}
 ranges.sort((left,right)=>left[0]-right[0]);
 let offset=0;
 const merged=[];
 for(const range of ranges){
  const last=merged.at(-1);
  if(last && range[0]<=last[1])last[1]=Math.max(last[1],range[1]);
  else merged.push(range);
 }
 for(const [start,end] of merged){
  paragraph.append(text.slice(offset,start),node(tag,text.slice(start,end)));
  offset=end;
 }
 paragraph.append(text.slice(offset));
}
function appendRevisedSentences(container, originals, revised) {
 const ranges=changedWordRanges(wordsWithOffsets(revised.join('\n'),true),wordsWithOffsets(originals.join('\n'),true),false);
 let start=0;
 for(const sentence of revised){
  const end=start+sentence.length;
  const highlights=englishText(sentence)!==sentence?[]:ranges.filter(([left,right])=>left<end && right>start)
   .map(([left,right])=>[Math.max(left,start)-start,Math.min(right,end)-start]);
  const paragraph=node('p');
  appendMarkedText(paragraph,sentence,highlights,'strong');
  container.append(paragraph);
  start=end+1;
 }
}
function explanationLines(why) {
 return displayText(why).split(/\r?\n|(?<=[。！？；])\s*|(?<=[;!?])\s+|(?<=[^.\s]\.)\s+(?=[A-Z])/u).map(line=>line.trim()).filter(Boolean);
}

 };
 return button;
}
function renderComparison(record,panel) {
 const originals=writingSentences(record.original.join('\n'));
 const revised=writingSentences(record.revised);
 const matches=grammarLocations(record,originals,archivedGrammarLocations[selected]||{});
 const pairs=sentencePairs(originals,revised,archivedSentenceGroups[selected]||[]);
 const errorPhrases=archivedErrorPhrases[selected]||{};
 const addBadge=(badges,index)=>{
  const [label,,,why]=record.grammar[index];
  const button=grammarNoteBadge(index+1,label,explanationLines(why));
  button.dataset.grammarIndex=index;
  badges.append(button);
 };
 let originalIndex=0;
 pairs.forEach(([before,after])=>{
  const block=node('section',undefined,'comparison-block');
  const original=node('div',undefined,'comparison-original');
  const originalRow=node('div',undefined,'comparison-with-badges');
  const originalText=node('div');
  originalText.append(node('div','Original','comparison-label'));
  originalRow.append(originalText);
  original.append(originalRow);
  const revisedBlock=node('div',undefined,'comparison-revised');
  revisedBlock.append(node('div','Revised','comparison-label'));
  const groupIssues=new Set();
  for(const sentence of before){
   const paragraph=node('p');
   const issueIndexes=matches.result[originalIndex++];
   markOriginalErrors(paragraph,sentence,issueIndexes,record.grammar||[],errorPhrases);
   issueIndexes.forEach(index=>groupIssues.add(index));
   originalText.append(paragraph);
  }
  if(!before.length)originalText.append(node('p','Added in the revision.','comparison-empty'));
  if(groupIssues.size){
   const badges=node('div',undefined,'error-badges');
   [...groupIssues].sort((a,b)=>a-b).forEach(index=>addBadge(badges,index));
   originalRow.append(badges);
  }
  appendRevisedSentences(revisedBlock,before,after);
  if(!after.length)revisedBlock.append(node('p','Omitted from the revision.','comparison-empty'));
  block.append(original,revisedBlock);
  panel.append(block);
 });
 if(matches.unfound.length){
  const row=node('div',undefined,'comparison-with-badges');
  const badges=node('div',undefined,'error-badges');
  matches.unfound.forEach(index=>addBadge(badges,index));
  row.append(node('span','Additional grammar notes','comparison-label'),badges);
  panel.append(row);
 }
}
function renderEntry(focus=false) {

 entry.append(list,viewport);
 tabs.forEach((_,tabIndex)=>{
  const panel=node('div',undefined,'writing-slide');

   if(!notes)panel.append(node('p','No notes for this entry.','hint'));
   else{
    panel.append(node('p',notes.intro,'hint'));
    for(const section of notes.sections){
     panel.append(node('h3',section.title));
     for(const item of section.items){
      const box=node('details'),summary=node('summary',item.name);
      box.append(summary);
      if(item.template)box.append(node('p',item.template,'pair'));
      if(item.example)box.append(node('p',displayText('Example: ')+displayText(item.example),'pair'));
      if(item.note)box.append(node('p',item.note));
      panel.append(box);
     }
    }
   }
  }else{
   panel.className='grammar writing-slide';
   panel.append(node('p','Try revising each sentence before revealing the answer.','hint'));
   for(const [tag,before,after,why] of record.grammar){
    const box=node('div',undefined,'excerpt');
    const item=node('details'),title=node('summary','Show answer');
    item.append(title,node('p',after,'pair'),node('p',why));
    box.append(node('b',tag),node('p',before,'pair'),node('p','Your revision: ________________','hint'),item);
    panel.append(box);
   }
  }
 });
 enableWritingSwipe(viewport);
 positionWritingTrack(false);
 updateWritingTabState(focus);
